<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="560" viewBox="0 0 1400 560"><rect width="1400" height="560" fill="#fffefa"/><g font-family="Arial, sans-serif"><text x="42" y="53" font-size="30" fill="#011f5b" font-weight="600">Recover the endpoint, then assess reliability</text><text x="42" y="88" font-size="18" fill="#68778a" font-weight="400">Schematic of incomplete expiration; the curve is illustrative, not a measured patient record.</text><g fill="none" stroke="#011f5b" stroke-width="4"><path d="M80 315H1330M80 315V135"/></g><path d="M80 305C140 190 240 165 370 150" fill="none" stroke="#990000" stroke-width="6"/><path d="M370 150C580 127 850 123 1270 122" fill="none" stroke="#011f5b" stroke-width="5" stroke-dasharray="12 9"/><path d="M370 140V320" stroke="#68778a" stroke-width="2" stroke-dasharray="6 6"/><text x="95" y="145" font-size="19" fill="#68778a" font-weight="400">Exhaled volume</text><text x="1150" y="345" font-size="18" fill="#68778a" font-weight="400">Time</text><text x="100" y="355" font-size="19" fill="#990000" font-weight="400">Observed prefix</text><text x="580" y="174" font-size="22" fill="#011f5b" font-weight="400">Modelled continuation toward total volume</text><text x="391" y="295" font-size="19" fill="#68778a" font-weight="400">Recording ends early</text><line x1="42" y1="386" x2="332" y2="386" stroke="#011f5b" stroke-opacity=".2"/><text x="42" y="422" font-size="17" fill="#990000" font-weight="600">01</text><text x="42" y="456" font-size="24" fill="#011f5b" font-weight="600">Decode</text><text x="42" y="487" font-size="18" fill="#68778a" font-weight="400">100 Hz waveform + onset</text><line x1="382" y1="386" x2="672" y2="386" stroke="#011f5b" stroke-opacity=".2"/><text x="382" y="422" font-size="17" fill="#990000" font-weight="600">02</text><text x="382" y="456" font-size="24" fill="#011f5b" font-weight="600">Reconstruct</text><text x="382" y="487" font-size="18" fill="#68778a" font-weight="400">Bounded two-compartment fit</text><line x1="722" y1="386" x2="1012" y2="386" stroke="#011f5b" stroke-opacity=".2"/><text x="722" y="422" font-size="17" fill="#990000" font-weight="600">03</text><text x="722" y="456" font-size="24" fill="#011f5b" font-weight="600">Assess reliability</text><text x="722" y="487" font-size="18" fill="#68778a" font-weight="400">Physics–ridge agreement</text><line x1="1062" y1="386" x2="1352" y2="386" stroke="#011f5b" stroke-opacity=".2"/><text x="1062" y="422" font-size="17" fill="#990000" font-weight="600">04</text><text x="1062" y="456" font-size="24" fill="#011f5b" font-weight="600">Screen or defer</text><text x="1062" y="487" font-size="18" fill="#68778a" font-weight="400">Fixed-coverage selection</text></g></svg>