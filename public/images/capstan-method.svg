" fill="#990000" font-weight="600">03</text><text x="722" y="456" font-size="24" fill="#011f5b" font-weight="600">Measure</text><text x="722" y="487" font-size="18" fill="#68778a" font-weight="400">Optical slip profiles</text><line x1="1062" y1="386" x2="1352" y2="386" stroke="#011f5b" stroke-opacity=".2"/><text x="1062" y="422" font-size="17" fill="#990000" font-weight="600">04</text><text x="1062" y="456" font-size="24" fill="#011f5b" font-weight="600">Validate</text><text x="1062" y="487" font-size="18" fill="#68778a" font-weight="400">84 runs · independent inputs</text></g></svg>