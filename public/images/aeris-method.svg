<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="560" viewBox="0 0 1400 560"><rect width="1400" height="560" fill="#fffefa"/><g font-family="Arial, sans-serif"><text x="42" y="53" font-size="30" fill="#011f5b" font-weight="600">From vocal information to a wearable response</text><text x="42" y="88" font-size="18" fill="#68778a" font-weight="400">Documented recognition and feedback components.</text><g transform="translate(60 140)"><rect x="0" width="365" height="180" rx="12" fill="#f3f6f7" stroke="#d7e0e7"/><text x="24" y="45" font-size="25" fill="#011f5b" font-weight="600">Audio input</text><text x="24" y="90" font-size="21" fill="#68778a" font-weight="400">Speech waveform</text><text x="24" y="124" font-size="21" fill="#68778a" font-weight="400">MFCC features</text><rect x="445" width="365" height="180" rx="12" fill="#f3f6f7" stroke="#d7e0e7"/><text x="469" y="45" font-size="25" fill="#011f5b" font-weight="600">Recognition</text><text x="469" y="90" font-size="21" fill="#68778a" font-weight="400">Speaker classification</text><text x="469" y="124" font-size="21" fill="#68778a" font-weight="400">Wav2Vec2 emotion output</text><rect x="890" width="365" height="180" rx="12" fill="#f3f6f7" stroke="#d7e0e7"/><text x="914" y="45" font-size="25" fill="#011f5b" font-weight="600">Physical feedback</text><text x="914" y="90" font-size="21" fill="#68778a" font-weight="400">Display information</text><text x="914" y="124" font-size="21" fill="#68778a" font-weight="400">Five haptic patterns</text></g><line x1="42" y1="386" x2="332" y2="386" stroke="#011f5b" stroke-opacity=".2"/><text x="42" y="422" font-size="17" fill="#990000" font-weight="600">01</text><text x="42" y="456" font-size="24" fill="#011f5b" font-weight="600">Capture</text><text x="42" y="487" font-size="18" fill="#68778a" font-weight="400">Audio observations</text><line x1="382" y1="386" x2="672" y2="386" stroke="#011f5b" stroke-opacity=".2"/><text x="382" y="422" font-size="17" fill="#990000" font-weigh